[config]

target_model = Qwen/Qwen3-8B
draft_model = Qwen/Qwen3-0.6B
language_code = ber
draft_model_type = neural
decoding_mode = greedy
task = translation
data_source = tatoeba
gamma = 5
max_samples = 6000

# Only fires when a token genuinely repeats within the window (count >= 2).
# HRLs (in our case, chinese(zh)): penalty=1.3  window=32
# LRLs / character-level tokenized (our other lang settings):
#   penalty=1.1 (or 1.0 to disable)  window=16

