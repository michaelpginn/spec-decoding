[project]
name = "spec-decoding"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.4.1",
    "ruff>=0.14.7",
    # for the distillation script
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "bitsandbytes>=0.43.0",
    "wandb>=0.24.2",
    "nltk>=3.8",
    "gensim>=4.3",
    "numpy>=1.24",
    "sacrebleu>=2.0.0",
    "tiktoken>=0.12.0",
    "pandas>=3.0.1",
    "huggingface-hub>1",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.0",
    # Fast kernels for Qwen3.5 linear-attention layers (GPU cluster only)
    "flash-linear-attention; sys_platform == 'linux'",
    # Prebuilt FlashAttention-2 kernels from the HF Hub (GPU cluster only). Pinned because
    # kernels>=0.15 requires a kernel version, which transformers 5.7 doesn't pass.
    "kernels==0.14.1; sys_platform == 'linux'",
    "kernels-data==0.14.1; sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pyright]
reportPrivateImportUsage = "none"
